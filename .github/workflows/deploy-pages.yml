name: Deploy BombRush to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client
        env:
          GITHUB_ACTIONS: 'true'
          VITE_SUPABASE_URL: https://qgxcloeodrgozalwrwux.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFneGNsb2VvZHJnb3phbHdyd3V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNDMxOTMsImV4cCI6MjEwNjkxOTE5M30.6svImHasCi_NFbXZt7dkuLNMiewLDIsVcRgrwOUSsb4
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
